<body>
  <h1>Lista</h1>

  <div>
    <p id="lista-titulo" name="lista">Meus itens:</p>
  </div>

  <ul id="lista-itens-1">
    <li id="one" class="hot">item a</li>
    <li id="two" class="hot">item b</li>
    <li id="three" class="hot">item c</li>
    <li id="four">item d</li>
  </ul>

  <script>
    const listaItens1 = document.getElementById("lista-itens-1");
    console.log(
      "i) Imprima no console o primeiro e último filho elementos HTML da lista-itens-1"
    );

    const firstElementChild = listaItens1.firstElementChild;
    const lastElementChild = listaItens1.lastElementChild;
    console.log(firstElementChild);
    console.log(lastElementChild);

    console.log("ii) Imprima no console o elemento HTML pai da lista-itens-1;");
    console.log(listaItens1.parentElement);

    console.log(
      "iii) Imprima no console os irmãos elemento HTML do item com id = ‘three’"
    );
    const three = document.getElementById("three");
    threeNextSibling = three.nextElementSibling;
    while (threeNextSibling) {
      console.log(threeNextSibling);
      threeNextSibling = threeNextSibling.nextElementSibling;
    }

    threePreviousSibling = three.previousElementSibling;
    while (threePreviousSibling) {
      console.log(threePreviousSibling);
      threePreviousSibling = threePreviousSibling.previousElementSibling;
    }
  </script>
</body>
