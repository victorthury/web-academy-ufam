<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="py-5">
      <div class="container">
        <h2 class="mb-4">Turma do professor Moisés</h2>

        <h4>Estatísticas</h4>
        <div id="estatistica"></div>

        <div class="mb-2 d-flex justify-content-end">
          <button
            type="button"
            class="btn btn-warning ms-auto"
            data-bs-toggle="modal"
            data-bs-target="#addModal"
          >
            Adiciona Aluno
          </button>
        </div>

        <h4>Alunos</h4>

        <div
          class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3"
          id="cardsContainer"
        ></div>
        <!-- Modal Adicionar -->
        <div class="modal fade" id="addModal">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5">Novo Aluno</h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form id="addForm">
                  <div class="mb-2">
                    <label for="name" class="form-label">Nome</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="name"
                      required
                    />
                  </div>
                  <div class="mb-2">
                    <label for="height" class="form-label">Altura</label>
                    <input
                      type="number"
                      class="form-control form-control-lg"
                      id="height"
                      step="0.01"
                      required
                    />
                  </div>
                  <div class="mb-4">
                    <label for="weight" class="form-label">Peso</label>
                    <input
                      type="number"
                      class="form-control form-control-lg"
                      id="weight"
                      step="0.1"
                      required
                    />
                  </div>
                  <div class="mb-4">
                    <label for="age" class="form-label">Idade</label>
                    <input
                      type="number"
                      class="form-control form-control-lg"
                      id="age"
                      required
                    />
                  </div>
                  <button type="submit" class="btn btn-success w-100 d-block">
                    Confirmar Cadastro
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal Editar -->
        <div class="modal fade" id="editModal">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5">Editar Aluno</h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form id="editForm">
                  <div class="mb-2">
                    <label for="editName" class="form-label">Nome</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="editName"
                    />
                  </div>
                  <div class="mb-2">
                    <label for="editHeight" class="form-label">Altura</label>
                    <input
                      type="number"
                      class="form-control form-control-lg"
                      id="editHeight"
                    />
                  </div>
                  <div class="mb-4">
                    <label for="editWeight" class="form-label">Peso</label>
                    <input
                      type="number"
                      class="form-control form-control-lg"
                      id="editWeight"
                    />
                  </div>
                  <div class="mb-4">
                    <label for="editAge" class="form-label">Idade</label>
                    <input
                      type="number"
                      class="form-control form-control-lg"
                      id="editAge"
                    />
                  </div>
                  <button type="submit" class="btn btn-success w-100 d-block">
                    Salvar Alterações
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../dist/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
