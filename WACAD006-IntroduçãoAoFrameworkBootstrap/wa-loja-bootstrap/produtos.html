<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-md bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">Loja WA</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="./index.html">
                Inicio
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./produtos.html">
                Gerenciar Produtos
              </a>
            </li>
          </ul>
          <button type="button" class="btn btn-secondary">Sair</button>
        </div>
      </div>
    </nav>
    <!-- navbar -->

    <!-- gerenciar produtos -->

    <div class="py-5">
      <div class="container">
        <h5 class="mb-4">Gerenciar Produtos</h5>
        <div class="mb-2 d-flex justify-content-end">
          <button
            type="button"
            class="btn btn-warning ms-auto"
            data-bs-toggle="modal"
            data-bs-target="#exampleModal"
          >
            Novo Produto
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">id</th>
                <th scope="col">Produto</th>
                <th scope="col">Preço</th>
                <th scope="col">Estoque</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">1</th>
                <td>Bicicleta</td>
                <td>R$ 1.000,00</td>
                <td>110</td>
                <td>
                  <div class="gap-3">
                    <button class="btn btn-secondary">Editar</button>
                    <button class="btn btn-secondary">Excluir</button>
                  </div>
                </td>
              </tr>
              <tr>
                <th scope="row">2</th>
                <td>Echo dot</td>
                <td>R$ 600,00</td>
                <td>8</td>
                <td>
                  <div class="gap-3">
                    <button class="btn btn-secondary">Editar</button>
                    <button class="btn btn-secondary">Excluir</button>
                  </div>
                </td>
              </tr>
              <tr>
                <th scope="row">3</th>
                <td>Celular</td>
                <td>R$ 1.500,00</td>
                <td>10</td>
                <td>
                  <div class="gap-3">
                    <button class="btn btn-secondary">Editar</button>
                    <button class="btn btn-secondary">Excluir</button>
                  </div>
                </td>
              </tr>
              <tr>
                <th scope="row">4</th>
                <td>Umidificador</td>
                <td>R$ 100,00</td>
                <td class="text-danger fw-bold">0</td>
                <td>
                  <div class="gap-3">
                    <button class="btn btn-secondary">Editar</button>
                    <button class="btn btn-secondary">Excluir</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="modal fade" id="exampleModal">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5">Novo produto</h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form>
                  <div class="mb-2">
                    <label for="product" class="form-label">Produto</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="product"
                      aria-describedby="product"
                      required
                    />
                  </div>
                  <div class="mb-2">
                    <label for="price" class="form-label">Preço</label>
                    <div class="input-group">
                      <span class="input-group-text" id="priceCurrency">
                        R$
                      </span>
                      <input
                        type="number"
                        class="form-control form-control-lg"
                        id="price"
                        aria-describedby="priceCurrency"
                        required
                      />
                      <span class="input-group-text">.00</span>
                    </div>
                  </div>
                  <div class="mb-4">
                    <label for="stock" class="form-label">Estoque</label>
                    <input
                      type="number"
                      class="form-control form-control-lg"
                      id="stock"
                      aria-describedby="stock"
                      required
                    />
                  </div>
                  <button type="submit" class="btn btn-success w-100 d-block">
                    Confirmar Cadastro
                  </button>
                </form>
              </div>
              <div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- gerenciar produtos -->

    <!-- modal cadastrar produtos -->
    <!-- modal cadastrar produtos -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
