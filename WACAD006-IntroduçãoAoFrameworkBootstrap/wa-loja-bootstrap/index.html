<!DOCTYPE html>
<html lang="pt-BR">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA</title>
    <link

    />
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-md bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">Loja WA</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">

            <li class="nav-item">

              </a>

          </ul>
          <button type="button" class="btn btn-secondary">Sair</button>
        </div>

      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
        <div class="col">
          <div class="card">
            <img

              class="card-img-top"
              alt="placeholder-image"
            />
            <div class="card-body bg-light">
              <h5 class="card-title">Bicicleta</h5>
              <p class="card-text">
                <small class="text-muted"> R$1.000,00 </small>

              <a href="#" class="btn btn-primary w-100">
                Adicionar no carrinho
              </a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card">
            <img
              src="./assets/placeholder-image.png"

              alt="placeholder-image"
            />
            <div class="card-body bg-light">
              <h5 class="card-title">Echo dot</h5>
              <p class="card-text">
                <small class="text-muted"> R$600,00 </small>

              <a href="#" class="btn btn-primary w-100">
                Adicionar no carrinho
              </a>
            </div>
          </div>
        </div>
        <div class="col">

          </div>

        <div class="col">

            <img
              src="./assets/placeholder-image.png"
              class="card-img-top"
              alt="placeholder-image"
            />
            <div class="card-body bg-light">
              <h5 class="card-title">Umidificador</h5>
              <p class="card-text">
                <small class="text-muted"> R$100,00 </small>
              </p>
              <a href="#" class="btn btn-secondary disabled w-100">
                Indisponível
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- listagem de produtos -->

    <script
