version: "3.8"
services:
  db:
    image: mysql/mysql-server:latest
    container_name: my-mysql
    restart: always
    environment:
      - MYSQL_DATABASE=mysqlDB
      - MYSQL_ROOT_PASSWORD=webacademy
      - MYSQL_USER=webacademy
      - MYSQL_PASSWORD=webacademy
      - MYSQL_DATABASE=webacademy
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
volumes:
  mysql-volume:
    driver: local
